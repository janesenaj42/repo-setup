# Releases repo-setup: tags `v<version>` (the version in package.json on the branch it runs on),
# publishes the package to GitHub Packages and creates the GitHub release. Run it from the Actions
# tab after the PR that bumped the version (`npm run release:<type>`) is merged. A tag pushed by
# hand publishes too.
name: Release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      # Fail here, before anything is
      # tagged or published, rather than half way through.
      - name: The runner has git and gh
        run: |
          missing=0
          for tool in git gh; do
            command -v "$tool" >/dev/null || { echo "::error::$tool isn't installed on this runner."; missing=1; }
          done
          exit "$missing"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
      - run: npm ci
      - run: npm test
      - name: Work out the version and tag
        id: release
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${{ github.ref_type }}" = tag ] && [ "${{ github.ref_name }}" != "v$version" ]; then
            echo "Tag ${{ github.ref_name }} doesn't match package.json ($version)." >&2
            exit 1
          fi
          case "$version" in *-*) dist=next ;; *) dist=latest ;; esac
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "dist=$dist" >> "$GITHUB_OUTPUT"
      - name: Tag the release
        if: github.ref_type != 'tag'
        run: |
          git tag "${{ steps.release.outputs.tag }}"
          git push origin "${{ steps.release.outputs.tag }}"
      # A prerelease (1.2.0-rc.0) goes to the "next" dist-tag so it never becomes "latest".
      - run: npm publish --tag "${{ steps.release.outputs.dist }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Notes come from the version's CHANGELOG.md section; a version without one gets GitHub's
      # generated notes.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          PRERELEASE: ${{ steps.release.outputs.dist == 'next' }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            /^## / { p = index($0, "## [" v "]") == 1 || index($0, "## " v " ") == 1; next }
            p
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ -s "$RUNNER_TEMP/notes.md" ]; then notes=(--notes-file "$RUNNER_TEMP/notes.md"); else notes=(--generate-notes); fi
          gh release create "$TAG" --verify-tag --title "$TAG" --prerelease="$PRERELEASE" "${notes[@]}"
