# Git hooks every repository gets. Your own commands go in lefthook.yml, which extends this
# file. lefthook lets this file win over lefthook.yml, so repo-setup leaves out a command that
# lefthook.yml already has under the same hook and name: give yours the same name to replace one,
# then re-run repo-setup.
commit-msg:
  commands:
    conventional-commit:
      run: npx --no -- commitlint --edit {1}

pre-push:
  commands:
    branch-name:
      run: node .baseline/checks/branch-name.mjs

pre-commit:
  parallel: true
  commands:
    baseline:
      run: node .baseline/checks/baseline.mjs
    json-valid:
      glob: "*.{json,jsonc}"
      run: node .baseline/checks/json-valid.mjs {staged_files}
